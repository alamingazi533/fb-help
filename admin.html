<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অ্যাডমিন প্যানেল - ফেসবুক সমস্যা সমাধান</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F3B2C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="অ্যাডমিন প্যানেল">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EA;
    --paper-dark:#F2EBDA;
    --ink:#22281F;
    --forest:#1F3B2C;
    --forest-2:#2C4F3A;
    --gold:#B8863B;
    --gold-light:#D9AE6B;
    --maroon:#7A2E2E;
    --line:#D8CDAE;
    --ok:#2C6B4F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    font-family:'Hind Siliguri', sans-serif;
    color:var(--ink);
    padding:0 0 60px;
  }
  header{
    background:linear-gradient(135deg, var(--forest) 0%, var(--forest-2) 100%);
    color:var(--paper);
    padding:22px 16px;
    text-align:center;
  }
  header h1{
    font-family:'Noto Serif Bengali', serif;
    font-size:20px;
    margin:0;
  }
  main{max-width:640px; margin:0 auto; padding:16px;}

  /* লগইন স্ক্রিন */
  #loginBox{
    max-width:360px;
    margin:60px auto;
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:26px 22px;
    box-shadow:0 18px 40px -20px rgba(31,59,44,0.35);
    text-align:center;
  }
  #loginBox h2{font-family:'Noto Serif Bengali', serif; color:var(--forest); font-size:19px; margin:0 0 16px;}
  #loginBox input{
    width:100%; padding:12px; border-radius:8px; border:1.5px solid var(--line);
    font-size:16px; font-family:inherit; margin-bottom:12px; outline:none;
  }
  #loginBox button, .btn{
    width:100%; padding:12px; border:none; border-radius:9px;
    background:var(--forest); color:var(--paper); font-family:inherit;
    font-size:15.5px; font-weight:700; cursor:pointer;
  }
  #loginErr{color:var(--maroon); font-size:13.5px; margin-top:8px; display:none;}

  /* টুলবার */
  .toolbar{display:flex; gap:8px; margin-bottom:14px;}
  .toolbar input{
    flex:1; padding:11px 12px; border-radius:8px; border:1.5px solid var(--line);
    font-size:15px; font-family:inherit; outline:none;
  }
  .toolbar button{
    padding:11px 16px; border-radius:8px; border:1.5px solid var(--forest);
    background:#fff; color:var(--forest); font-weight:700; font-family:inherit; cursor:pointer;
  }
  .summary{font-size:13px; color:#6b6752; margin-bottom:12px;}

  /* কার্ড */
  .card{
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:16px; margin-bottom:12px; box-shadow:0 10px 24px -18px rgba(31,59,44,0.3);
  }
  .card-top{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .applicant-photo{
    width:44px; height:44px; border-radius:8px; object-fit:cover;
    border:1.5px solid var(--line); cursor:pointer; flex-shrink:0;
  }
  .card-name{font-size:16.5px; font-weight:700; color:var(--forest);}
  .card-id{font-size:12px; color:var(--gold); font-weight:600;}
  .card-top > div:first-child{flex:1; min-width:0;}
  .badge{
    display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700;
    background:var(--paper-dark); color:var(--forest); white-space:nowrap;
  }
  .badge.done{background:#E6F0EA; color:var(--ok);}
  .badge.progress{background:#FDF1DC; color:#8a5a12;}
  .badge.cancel{background:#F6E7E4; color:var(--maroon);}
  .row{font-size:14px; margin-top:6px; line-height:1.6;}
  .row .lbl{color:#7a7460; margin-right:4px;}
  .card-comment{
    background:var(--paper-dark); border-radius:8px; padding:10px 12px; margin-top:8px; font-size:13.5px;
  }
  .card-actions{display:flex; gap:8px; margin-top:12px;}
  .card-actions input.statusInput{
    flex:1; padding:9px; border-radius:8px; border:1.5px solid var(--line); font-family:inherit; font-size:14px; outline:none;
  }
  .card-actions button{
    padding:9px 14px; border:none; border-radius:8px; background:var(--forest); color:#fff;
    font-weight:700; font-family:inherit; cursor:pointer; font-size:14px;
  }
  .card-actions button:disabled{opacity:.6; cursor:wait;}
  .card a.ss-link{color:var(--forest); font-weight:600; text-decoration:underline; font-size:13.5px;}
  #loadingMsg, #emptyMsg{text-align:center; color:#8a8571; padding:30px 0; display:none;}

  .dashboard{display:flex; gap:8px; overflow-x:auto; margin-bottom:12px; padding-bottom:2px;}
  .dash-item{
    flex:0 0 auto; background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:8px 14px; text-align:center; min-width:76px;
  }
  .dash-item .num{font-size:18px; font-weight:700; color:var(--forest);}
  .dash-item .lbl{font-size:11px; color:#7a7460; margin-top:2px;}

  .filterRow{display:flex; gap:7px; overflow-x:auto; margin-bottom:12px; padding-bottom:2px;}
  .chip{
    flex:0 0 auto; padding:7px 13px; border-radius:999px; border:1.5px solid var(--line);
    background:#fff; color:var(--ink); font-size:13px; font-family:inherit; cursor:pointer; font-weight:600;
  }
  .chip.active{background:var(--forest); border-color:var(--forest); color:#fff;}

  .exportBtn{
    width:100%; padding:10px; border:1.5px solid var(--forest); border-radius:8px;
    background:#fff; color:var(--forest); font-family:inherit; font-weight:700; font-size:14px; cursor:pointer;
  }
  .deleteBtn{
    padding:9px 12px; border:1.5px solid var(--maroon); border-radius:8px; background:#fff;
    color:var(--maroon); font-family:inherit; font-weight:700; cursor:pointer; font-size:13px;
  }
  .waBtn{
    width:100%; padding:10px; border:none; border-radius:8px; background:#25D366;
    color:#fff; font-family:inherit; font-weight:700; cursor:pointer; font-size:14px;
  }
  #logoutBtn{
    background:transparent; border:1px solid rgba(255,255,255,0.5); color:var(--paper);
    padding:6px 12px; border-radius:7px; font-size:12.5px; font-family:inherit; cursor:pointer;
    position:absolute; right:14px; top:22px;
  }
  header{position:relative;}
</style>
</head>
<body>

<div id="loginBox">
  <h2>অ্যাডমিন লগইন</h2>
  <input type="password" id="pwInput" placeholder="পাসওয়ার্ড দিন" autocomplete="off">
  <button onclick="login()">লগইন করুন</button>
  <div id="loginErr">পাসওয়ার্ড ভুল হয়েছে, আবার চেষ্টা করুন।</div>
</div>

<div id="panel" style="display:none;">
  <header>
    <h1>রেজিস্ট্রেশন - অ্যাডমিন প্যানেল</h1>
    <button id="logoutBtn" onclick="logout()">লগ-আউট</button>
  </header>
  <main>
    <div class="toolbar">
      <input type="text" id="searchBox" placeholder="নাম, ফোন বা আবেদন নম্বর দিয়ে খুঁজুন">
      <button onclick="manualRefresh()">রিফ্রেশ</button>
    </div>
    <div class="dashboard" id="dashboard"></div>
    <div class="filterRow" id="filterRow"></div>
    <div class="toolbar" style="margin-top:0;">
      <button class="exportBtn" onclick="exportCsv()">CSV ডাউনলোড করুন</button>
    </div>
    <div class="summary" id="summary"></div>
    <div class="summary" id="lastUpdated" style="margin-top:-6px;">প্রতি ৩০ সেকেন্ডে অটো-আপডেট হয়</div>
    <div id="loadingMsg">লোড হচ্ছে...</div>
    <div id="emptyMsg">কোনো এন্ট্রি পাওয়া যায়নি।</div>
    <div id="list"></div>
    <datalist id="statusSuggestions">
      <option value="অপেক্ষমান">
      <option value="কাজ চলছে">
      <option value="সম্পন্ন">
      <option value="বাতিল">
    </datalist>
  </main>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbymlff-q29ojuF8V_i1GYCzYcUcvLA8XPHlOkhOoSAW0KkM7l9B5WbLCHg7uGTe1kjY/exec";
const STATUS_OPTIONS = ["অপেক্ষমান", "কাজ চলছে", "সম্পন্ন", "বাতিল"];

let allRows = [];
let autoRefreshTimer = null;
let activeStatusFilter = 'সব';

function applyCurrentFilter(){
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  let filtered = allRows;
  if(activeStatusFilter !== 'সব'){
    filtered = filtered.filter(r => r.status === activeStatusFilter);
  }
  if(q){
    filtered = filtered.filter(r =>
      (r.fullName || '').toLowerCase().includes(q) ||
      (r.phone || '').includes(q) ||
      (r.appId || '').toLowerCase().includes(q)
    );
  }
  renderList(filtered);
  renderDashboard();
  renderFilterChips();
}

function renderDashboard(){
  const dash = document.getElementById('dashboard');
  const counts = {};
  STATUS_OPTIONS.forEach(s => counts[s] = 0);
  allRows.forEach(r => { counts[r.status] = (counts[r.status] || 0) + 1; });
  let html = '<div class="dash-item"><div class="num">' + allRows.length + '</div><div class="lbl">মোট</div></div>';
  STATUS_OPTIONS.forEach(s => {
    html += '<div class="dash-item"><div class="num">' + (counts[s] || 0) + '</div><div class="lbl">' + s + '</div></div>';
  });
  dash.innerHTML = html;
}

function renderFilterChips(){
  const row = document.getElementById('filterRow');
  const options = ['সব'].concat(STATUS_OPTIONS);
  row.innerHTML = options.map(s =>
    '<button class="chip' + (s === activeStatusFilter ? ' active' : '') + '" data-status="' + s + '">' + s + '</button>'
  ).join('');
  row.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeStatusFilter = btn.getAttribute('data-status');
      applyCurrentFilter();
    });
  });
}

function exportCsv(){
  if(!allRows.length){ alert('ডাউনলোড করার মতো কোনো এন্ট্রি নেই।'); return; }
  const headers = ['তারিখ','নাম','ফোন','জন্ম তারিখ','লিঙ্গ','ইমেইল','বিভাগ','জেলা','এলাকা','মন্তব্য','পেমেন্ট মেথড','TxnID','প্রেরক নম্বর','আবেদন নম্বর','স্ট্যাটাস','ছবি লিংক'];
  const csvRows = [headers.join(',')];
  allRows.forEach(r => {
    const line = [r.date, r.fullName, r.phone, r.dob, r.gender, r.email, r.division, r.district, r.areaDetail, r.comment, r.paymentMethod, r.txnId, r.senderNumber, r.appId, r.status, r.photoUrl]
      .map(v => '"' + String(v === undefined || v === null ? '' : v).replace(/"/g, '""') + '"')
      .join(',');
    csvRows.push(line);
  });
  const csvContent = '\uFEFF' + csvRows.join('\n');
  const blob = new Blob([csvContent], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'registrations_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function deleteEntry(rowIndex, fullName, cardEl){
  const pw = sessionStorage.getItem('adminPw');
  if(!confirm(fullName + ' এর আবেদনটি সম্পূর্ণ মুছে ফেলতে চান? এটা আর ফেরত পাওয়া যাবে না।')) return;
  fetch(SCRIPT_URL + '?action=deleteRow&password=' + encodeURIComponent(pw) + '&row=' + encodeURIComponent(rowIndex))
    .then(r => r.json())
    .then(data => {
      if(data.success){
        cardEl.remove();
        allRows = allRows.filter(r => r.rowIndex !== rowIndex);
        renderDashboard();
        document.getElementById('summary').textContent = 'মোট ' + document.querySelectorAll('.card').length + 'টি আবেদন দেখানো হচ্ছে';
      } else {
        alert('ডিলিট করতে সমস্যা হয়েছে।');
      }
    })
    .catch(() => alert('সংযোগে সমস্যা হয়েছে।'));
}

function startAutoRefresh(){
  if(autoRefreshTimer) return;
  autoRefreshTimer = setInterval(loadEntries, 30000);
}

function stopAutoRefresh(){
  if(autoRefreshTimer){
    clearInterval(autoRefreshTimer);
    autoRefreshTimer = null;
  }
}

function badgeClass(status){
  if(status === "সম্পন্ন") return "badge done";
  if(status === "কাজ চলছে") return "badge progress";
  if(status === "বাতিল") return "badge cancel";
  return "badge";
}

function login(){
  const pw = document.getElementById('pwInput').value.trim();
  if(!pw){ return; }
  sessionStorage.setItem('adminPw', pw);
  verifyAndEnter();
}

function verifyAndEnter(){
  const pw = sessionStorage.getItem('adminPw');
  if(!pw){ return; }
  document.getElementById('loginErr').style.display = 'none';
  fetch(SCRIPT_URL + '?action=list&password=' + encodeURIComponent(pw))
    .then(r => r.json())
    .then(data => {
      if(data.success){
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('panel').style.display = 'block';
        allRows = data.rows;
        applyCurrentFilter();
        document.getElementById('lastUpdated').textContent = 'সবশেষ আপডেট: ' + new Date().toLocaleTimeString('bn-BD');
        startAutoRefresh();
      } else {
        sessionStorage.removeItem('adminPw');
        document.getElementById('loginErr').style.display = 'block';
      }
    })
    .catch(() => {
      document.getElementById('loginErr').textContent = 'সংযোগে সমস্যা হয়েছে, আবার চেষ্টা করুন।';
      document.getElementById('loginErr').style.display = 'block';
    });
}

function logout(){
  sessionStorage.removeItem('adminPw');
  stopAutoRefresh();
  document.getElementById('panel').style.display = 'none';
  document.getElementById('loginBox').style.display = 'block';
  document.getElementById('pwInput').value = '';
}

function loadEntries(){
  const pw = sessionStorage.getItem('adminPw');
  fetch(SCRIPT_URL + '?action=list&password=' + encodeURIComponent(pw))
    .then(r => r.json())
    .then(data => {
      if(data.success){
        allRows = data.rows;
        applyCurrentFilter();
        const now = new Date();
        document.getElementById('lastUpdated').textContent = 'সবশেষ আপডেট: ' + now.toLocaleTimeString('bn-BD');
      }
    })
    .catch(() => {
      // নীরবে ব্যর্থ হোক, অটো-রিফ্রেশে বারবার এলার্ট দেখানোর দরকার নেই
    });
}

function manualRefresh(){
  document.getElementById('loadingMsg').style.display = 'block';
  document.getElementById('emptyMsg').style.display = 'none';
  const pw = sessionStorage.getItem('adminPw');
  fetch(SCRIPT_URL + '?action=list&password=' + encodeURIComponent(pw))
    .then(r => r.json())
    .then(data => {
      document.getElementById('loadingMsg').style.display = 'none';
      if(data.success){
        allRows = data.rows;
        applyCurrentFilter();
        const now = new Date();
        document.getElementById('lastUpdated').textContent = 'সবশেষ আপডেট: ' + now.toLocaleTimeString('bn-BD');
      }
    })
    .catch(() => {
      document.getElementById('loadingMsg').style.display = 'none';
      alert('লোড করতে সমস্যা হয়েছে।');
    });
}

function renderList(rows){
  const listEl = document.getElementById('list');
  const summaryEl = document.getElementById('summary');
  listEl.innerHTML = '';
  summaryEl.textContent = 'মোট ' + rows.length + 'টি আবেদন';
  document.getElementById('emptyMsg').style.display = rows.length ? 'none' : 'block';

  rows.forEach(row => {
    const card = document.createElement('div');
    card.className = 'card';

    card.innerHTML =
      '<div class="card-top">' +
        '<div><div class="card-name">' + esc(row.fullName) + '</div><div class="card-id">' + (row.appId === 'N/A' ? 'সারি #' + row.rowIndex : esc(row.appId)) + '</div></div>' +
        (row.photoUrl ? '<img class="applicant-photo" src="' + row.photoUrl + '" alt="ছবি" onclick="window.open(\'' + row.photoUrl + '\', \'_blank\')">' : '') +
        '<span class="' + badgeClass(row.status) + '">' + esc(row.status) + '</span>' +
      '</div>' +
      '<div class="row"><span class="lbl">তারিখ:</span>' + esc(row.date) + '</div>' +
      '<div class="row"><span class="lbl">ফোন:</span>' + esc(row.phone) + '</div>' +
      (row.email ? '<div class="row"><span class="lbl">ইমেইল:</span>' + esc(row.email) + '</div>' : '') +
      '<div class="row"><span class="lbl">ঠিকানা:</span>' + esc(row.division) + ', ' + esc(row.district) + (row.areaDetail ? ' - ' + esc(row.areaDetail) : '') + '</div>' +
      '<div class="row"><span class="lbl">পেমেন্ট:</span>' + esc(row.paymentMethod) + ' | TxnID: ' + esc(row.txnId) + ' | নম্বর: ' + esc(row.senderNumber) + '</div>' +
      (row.screenshotUrl ? '<div class="row"><a class="ss-link" href="' + row.screenshotUrl + '" target="_blank">পেমেন্ট স্ক্রিনশট দেখুন</a></div>' : '') +
      (row.comment ? '<div class="card-comment">' + esc(row.comment) + '</div>' : '') +
      '<div class="card-actions">' +
        '<input type="text" class="statusInput" list="statusSuggestions" value="' + esc(row.status) + '" placeholder="স্ট্যাটাস লিখুন">' +
        '<button class="saveBtn">আপডেট</button>' +
        '<button class="deleteBtn">ডিলিট</button>' +
      '</div>' +
      '<div class="card-actions" style="margin-top:8px;">' +
        '<button class="waBtn">📱 WhatsApp পাঠান</button>' +
      '</div>';

    const saveBtn = card.querySelector('.saveBtn');
    const select = card.querySelector('.statusInput');
    const deleteBtn = card.querySelector('.deleteBtn');
    const waBtn = card.querySelector('.waBtn');
    saveBtn.addEventListener('click', () => updateStatus(row.rowIndex, select.value, saveBtn, card));
    deleteBtn.addEventListener('click', () => deleteEntry(row.rowIndex, row.fullName, card));
    waBtn.addEventListener('click', () => sendWhatsApp(row.phone, row.fullName, row.appId, select.value));

    listEl.appendChild(card);
  });
}

function updateStatus(rowIndex, newStatus, btn, card){
  const pw = sessionStorage.getItem('adminPw');
  btn.disabled = true;
  btn.textContent = 'সেভ হচ্ছে...';
  fetch(SCRIPT_URL + '?action=updateStatus&password=' + encodeURIComponent(pw) + '&row=' + encodeURIComponent(rowIndex) + '&status=' + encodeURIComponent(newStatus))
    .then(r => r.json())
    .then(data => {
      btn.disabled = false;
      btn.textContent = 'আপডেট';
      if(data.success){
        const badge = card.querySelector('.badge');
        badge.textContent = newStatus;
        badge.className = badgeClass(newStatus);
      } else {
        alert('আপডেট করতে সমস্যা হয়েছে।');
      }
    })
    .catch(() => {
      btn.disabled = false;
      btn.textContent = 'আপডেট';
      alert('সংযোগে সমস্যা হয়েছে।');
    });
}

function normalizePhone(phone){
  let digits = String(phone || '').replace(/\D/g, '');
  if(digits.startsWith('0')) digits = '88' + digits;
  else if(digits.startsWith('880')) digits = digits;
  else if(!digits.startsWith('88')) digits = '880' + digits;
  return digits;
}

function statusMessage(fullName, appId, status){
  const idLine = (appId && appId !== 'N/A') ? ('আবেদন নম্বর: ' + appId + '\n') : '';
  let line;
  if(status === 'সম্পন্ন') line = 'আপনার আবেদনটির কাজ সম্পন্ন হয়েছে। ধন্যবাদ।';
  else if(status === 'কাজ চলছে') line = 'আপনার আবেদনটি নিয়ে কাজ চলছে। একটু অপেক্ষা করুন।';
  else if(status === 'বাতিল') line = 'দুঃখিত, আপনার আবেদনটি বাতিল করা হয়েছে। বিস্তারিত জানতে যোগাযোগ করুন।';
  else line = 'আপনার আবেদনটি জমা হয়েছে, বর্তমানে অপেক্ষমান আছে।';
  return 'প্রিয় ' + fullName + ',\n' + idLine + 'স্ট্যাটাস: ' + status + '\n' + line;
}

function sendWhatsApp(phone, fullName, appId, status){
  if(!phone){ alert('এই আবেদনকারীর ফোন নম্বর পাওয়া যায়নি।'); return; }
  const number = normalizePhone(phone);
  const message = statusMessage(fullName, appId, status);
  const url = 'https://wa.me/' + number + '?text=' + encodeURIComponent(message);
  window.open(url, '_blank');
}
function esc(str){
  if(str === undefined || str === null) return '';
  const div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML;
}

document.getElementById('searchBox').addEventListener('input', applyCurrentFilter);

document.getElementById('pwInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') login();
});

if(sessionStorage.getItem('adminPw')){
  verifyAndEnter();
}
